name: Deploy to office.ncatfmd.com.ng

# Build → test (gate) → deploy on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- PHP ----
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, pdo_mysql, tokenizer, xml, dom, gd, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Install WITH dev dependencies so the test suite (PHPUnit) is available.
      - name: Install PHP dependencies (with dev)
        run: composer install --no-interaction --prefer-dist --no-progress

      # ---- Node ----
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build front-end assets
        run: npm run build

      # ---- Test gate (must pass to deploy) ----
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
        # Tests run on in-memory sqlite (see phpunit.xml) — no DB service needed.

      - name: Run test suite
        run: php artisan test

      # ---- Reinstall production-only dependencies for the deploy artifact ----
      - name: Install PHP dependencies (production, optimized)
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      # ---- Deploy over SSH (rsync) ----
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync application to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='storage/app' \
            --exclude='storage/framework/cache/data' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='storage/logs' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Post-deploy — migrate, cache, storage link
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -lc "
            set -e
            cd '$DEPLOY_PATH'
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            [ -L public/storage ] || php artisan storage:link
          "

      # ---- Health check ----
      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://office.ncatfmd.com.ng/up || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then echo "Health check passed."; exit 0; fi
            sleep 10
          done
          echo "Health check failed."; exit 1
