name: CI and deploy to office.ncatfmd.com.ng

# Two jobs, one gate.
#   test:   runs on pull requests AND on push to main, so a branch gets a MySQL
#           verdict without touching production.
#   deploy: runs only on push to main (or manual dispatch), and only after test
#           passes. Its trigger conditions and secrets usage are unchanged from
#           when this was a single build-test-deploy job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      seed_demo:
        description: 'Also seed demonstration data on the server (manual runs only)'
        type: boolean
        default: false

concurrency:
  # Keyed per ref so a pull-request run neither queues behind nor cancels a
  # production deploy. `main` is a single ref, so deploys still serialise exactly
  # as they did under the old fixed `deploy-production` group. Superseded PR runs
  # are cancelled; main runs never are.
  group: ncat-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Test gate. Nothing here touches the server or reads a deploy secret.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    # The suite runs in about three minutes. A test that shells out to an
    # external tool (a DB dump, say) can block instead of failing, and without
    # this the job sat for GitHub's six-hour default before anyone was told.
    # Fail fast enough to read as a fault rather than as a slow queue.
    timeout-minutes: 20

    # MySQL 8 service so the test gate runs against the same engine as
    # production (shared cPanel MySQL). Local dev keeps in-memory SQLite via
    # phpunit.xml; CI overrides the connection with the DB_* env vars on the
    # "Run test suite" step below (phpunit's <env> tags are non-forced, so real
    # environment variables take precedence). Running on real MySQL is what
    # makes StockService's `lockForUpdate` row locking — and the oversell /
    # concurrent-numbering guards — actually engage (SQLite :memory: no-ops them).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ncat_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      # checkout/setup-node/cache sit on majors that run under the Node 24
      # actions runtime. The v4 line ran under Node 20, which GitHub has
      # deprecated. This is the runtime the action itself executes in, and is a
      # separate thing from `node-version` below, which is the toolchain that
      # builds our assets and stays on 20 deliberately. All three take the same
      # inputs as before; the Node 24 runtime wants runner 2.327.1 or newer,
      # which ubuntu-latest satisfies.
      - name: Checkout
        uses: actions/checkout@v7

      # ---- PHP ----
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, pdo_mysql, tokenizer, xml, dom, gd, zip
          coverage: none

      # Cache key is scoped to the dev install. The deploy job installs --no-dev
      # into the same path, so a shared key would let one job restore the other's
      # vendor tree.
      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-dev-${{ hashFiles('composer.lock') }}
          restore-keys: composer-dev-

      # Install WITH dev dependencies so the test suite (PHPUnit) is available.
      - name: Install PHP dependencies (with dev)
        run: composer install --no-interaction --prefer-dist --no-progress

      # ---- Node ----
      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # Feature tests that assert on a rendered Inertia page resolve the page
      # component through the Vite manifest, so the assets must exist first.
      - name: Build front-end assets
        run: npm run build

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Runs against the MySQL 8 service (see `services.mysql` above), NOT the
      # phpunit.xml SQLite default. The DB_* env vars here override phpunit's
      # non-forced <env> tags, so RefreshDatabase migrates into the CI MySQL and
      # every locking/transaction path is exercised on the real engine.
      - name: Run test suite (MySQL 8 — real row locking)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ncat_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  # ---------------------------------------------------------------------------
  # Deploy. Gated on `test`, and on main only: a pull request never reaches here.
  # Every step below is byte-for-byte what the single job ran, including which
  # secrets it reads and how.
  # ---------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, pdo_mysql, tokenizer, xml, dom, gd, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-prod-${{ hashFiles('composer.lock') }}
          restore-keys: composer-prod-

      # Jobs do not share a filesystem, so the deploy artifact is built here.
      # Production-only, optimized autoloader, exactly as before.
      - name: Install PHP dependencies (production, optimized)
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build front-end assets
        run: npm run build

      # ---- Deploy over SSH ----
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_KEY or SSH_HOST secret is missing — cannot configure SSH."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Best-effort only: every ssh call below uses StrictHostKeyChecking=no, so a
          # transient ssh-keyscan blip to the shared host must NOT abort the deploy.
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # tar-over-SSH extracts ADDITIVELY (no rsync --delete), so old Vite hashed
      # chunks in public/build/assets would accumulate forever. Prune the build
      # dir before extraction; the fresh tar repopulates it with the current
      # manifest + assets. Scoped strictly to public/build — storage/ and .env
      # are never touched.
      - name: Prune stale build assets on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "rm -rf '$DEPLOY_PATH/public/build'"

      # Shared cPanel hosts usually lack `rsync`, so stream a gzipped tar over
      # SSH and extract on the server (only needs `tar`, which is always
      # present). `.env` is excluded so the server's own .env is never touched;
      # the storage/ skeleton is included so its framework dirs exist.
      - name: Deploy application to server (tar over SSH)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH'"
          tar czf - \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./node_modules' \
            --exclude='./tests' \
            --exclude='./.env' \
            . | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "tar xzf - -C '$DEPLOY_PATH'"

      - name: Post-deploy — migrate, cache, storage link
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -lc "
            set -e
            cd '$DEPLOY_PATH'
            # Delete stale bootstrap caches at the FILE level before booting any
            # artisan command. A config.php cached by a previous release predates
            # newly-added packages, so an auto-discovered provider (e.g.
            # spatie/laravel-backup) would boot with null config and abort —
            # and 'artisan optimize:clear' can't help because it must boot those
            # same providers to run. rm needs no framework boot, so it always works.
            rm -f bootstrap/cache/*.php
            # Now the framework boots from fresh config; clear the rest too.
            php artisan optimize:clear
            php artisan migrate --force
            # Seeders are idempotent (updateOrCreate/firstOrCreate) — safe every
            # deploy. Lands reference data (stores, types, 26 aircraft, ATA,
            # counters) and the permission catalogue/roles without resetting
            # existing accounts or admin-adjusted values.
            php artisan db:seed --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            [ -L public/storage ] || php artisan storage:link
          "

      # ---- Demonstration data (manual runs only) ----
      # Never fires on a push. It exists because the demo narrative has to be
      # created ON the server: deploying the seeder only ships the code, and
      # until `demo:seed` runs there is nothing in the transactional tables to
      # show anyone.
      #
      # Safe to tick by mistake. `demo:seed` refuses outright if transactional
      # data already exists, so it cannot land demo rows on top of real work;
      # that refusal fails this step loudly rather than proceeding.
      #
      # There is deliberately no matching purge button. `demo:purge` empties
      # every transactional table, and a one-click way to do that to production
      # is a hazard worth not building. Purge stays a considered SSH action, as
      # written up in docs/ADMIN_GO_LIVE_CHECKLIST.md.
      - name: Seed demonstration data
        if: github.event_name == 'workflow_dispatch' && inputs.seed_demo
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" bash -lc "
            set -e
            cd '$DEPLOY_PATH'
            php artisan demo:seed
          "

      # ---- Health check ----
      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://office.ncatfmd.com.ng/up || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then echo "Health check passed."; exit 0; fi
            sleep 10
          done
          echo "Health check failed."; exit 1
